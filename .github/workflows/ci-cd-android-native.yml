name: Android native checks

on:
  push:
    branches: [main, develop, 'release/**']
    paths:
      - 'hajj_app/app/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/ci-cd-android-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hajj_app/app/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/ci-cd-android-native.yml'
  workflow_dispatch:

jobs:
  debug-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hajj-app-debug-apk
          path: hajj_app/app/build/outputs/apk/debug/app-debug.apk
