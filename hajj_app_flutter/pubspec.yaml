name: hajj_app_flutter
description: A new Flutter project for Hajj app migration.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and navigation
  provider: ^6.0.5
  go_router: ^12.0.0

  # Database and storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Maps and location services
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # Permissions and device info
  permission_handler: ^11.3.0
  device_info_plus: ^9.0.3
  connectivity_plus: ^5.0.2

  # Image optimization and caching
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3

  # Performance optimization
  flutter_staggered_animations: ^1.1.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/